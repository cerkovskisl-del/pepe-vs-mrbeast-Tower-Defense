<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Pepe vs MrBeast: Tower Defense</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
      position: relative;
    }

    h1 {
      margin-bottom: 10px;
    }

    #UI {
      margin-bottom: 15px;
      font-size: 20px;
    }

    #canvasContainer {
      position: relative;
    }

    canvas {
      background-color: #2b2b2b;
      border: 4px solid #fff;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }

    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }

    button:hover {
      background-color: #45a049;
    }

    #nextLevel { background-color: #008CBA; }
    #nextLevel:hover { background-color: #007B9A; }
    button:active { transform: scale(0.95); }

    /* UPGRADE LOGA STILS */
    #upgradeMenu {
      display: none; /* Sākumā paslēpts */
      position: absolute;
      background-color: rgba(0, 0, 0, 0.9);
      border: 2px solid #f1c40f;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10;
    }

    #upgradeMenu h4 { margin: 0 0 10px 0; color: #f1c40f; }
    #upgradeBtn { background-color: #e67e22; margin-right: 5px; }
    #upgradeBtn:hover { background-color: #d35400; }
    #closeBtn { background-color: #95a5a6; }
    #closeBtn:hover { background-color: #7f8c8d; }
  </style>
</head>
<body>

  <h1>Pepe vs MrBeast: TD</h1>
  <div id="UI">
    Līmenis: <span id="level">1</span> | 
    Nauda: $<span id="money">100</span> | 
    Dzīvības: <span id="lives">10</span>
  </div>
  
  <div id="canvasContainer">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div id="upgradeMenu">
      <h4>Pepe Uzlabošana</h4>
      <p id="upgradeStats">Damage: 10 -> 25</p>
      <button id="upgradeBtn">Uzlabot ($75)</button>
      <button id="closeBtn">X</button>
    </div>
  </div>

  <div class="controls">
    <button id="buyPepe">Pirkt Pepe Torni ($50)</button>
    <button id="nextLevel">Sākt nākamo līmeni</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
