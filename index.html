<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pepe vs MrBeast: Mobile Edition</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none; /* Noņem teksta izvēli telefonā */
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background-color: #111;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #2ecc71;
      text-align: center;
    }

    #UI {
      margin-bottom: 10px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 15px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    #UI span { font-weight: bold; color: #f1c40f; }
    #UI #lives { color: #e74c3c; }
    #UI #level { color: #3498db; }

    #canvasContainer {
      position: relative;
      width: 100%;
      max-width: 800px; /* Maksimālais izmērs kā datorā */
    }

    canvas {
      background-color: #2b2b2b;
      border: 3px solid #444;
      border-radius: 8px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.7);
      display: block;
      width: 100%; /* Svarīgi: Telefonā izstiepsies/samazināsies pa visu ekrānu */
      height: auto; /* Saglabā 800x600 proporciju */
      touch-action: none; /* Neļauj telefonam ritināt lapu, kad aiztiek spēli */
    }

    .controls {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 800px;
    }

    button {
      flex: 1;
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      border: none;
      color: white;
      padding: 15px 10px; /* Lielākas pogas ērtākam klikšķim telefonā */
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s;
      text-transform: uppercase;
      text-align: center;
    }

    #nextLevel {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    button:disabled {
      background: #444;
      color: #777;
      box-shadow: none;
    }

    button:active {
      transform: scale(0.95);
    }

    /* MOBILAIS UPGRADE LOGS */
    #upgradeMenu {
      display: none;
      position: absolute;
      background: rgba(20, 20, 20, 0.95);
      border: 2px solid #f1c40f;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      z-index: 10;
      backdrop-filter: blur(4px);
      min-width: 150px;
    }

    #upgradeMenu h4 { margin: 0 0 5px 0; color: #f1c40f; text-transform: uppercase; font-size: 13px; }
    #upgradeStats { margin: 0 0 10px 0; font-size: 12px; color: #bbb; }
    
    .menu-buttons { display: flex; gap: 8px; justify-content: center; }
    #upgradeBtn { background: linear-gradient(135deg, #f39c12, #d35400); padding: 10px 12px; font-size: 13px; }
    #closeBtn { background: #e74c3c; padding: 10px 14px; font-size: 13px; max-width: 45px; }
  </style>
</head>
<body>

  <h1>Pepe vs MrBeast: TD</h1>
  <div id="UI">
    Lvl: <span id="level">1</span> | 
    Nauda: $<span id="money">120</span> | 
    Dzīvības: <span id="lives">10</span>
  </div>
  
  <div id="canvasContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="upgradeMenu">
      <h4>Pepe Upgrade</h4>
      <p id="upgradeStats">Dmg: 10 -> 25</p>
      <div class="menu-buttons">
        <button id="upgradeBtn">Uzlabot</button>
        <button id="closeBtn">X</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="buyPepe">Pirkt Pepe ($50)</button>
    <button id="nextLevel">Sākt</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
