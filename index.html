<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <title>Pepe vs MrBeast: Tower Defense</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: white;
      font-family: 'Arial', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
    }

    h1 {
      margin-bottom: 10px;
    }

    #UI {
      margin-bottom: 15px;
      font-size: 20px;
    }

    canvas {
      background-color: #2b2b2b;
      border: 4px solid #fff;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }

    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }

    button:hover {
      background-color: #45a049;
    }

    #nextLevel {
      background-color: #008CBA;
    }

    #nextLevel:hover {
      background-color: #007B9A;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <h1>Pepe vs MrBeast: TD</h1>
  <div id="UI">
    Līmenis: <span id="level">1</span> | 
    Nauda: $<span id="money">100</span> | 
    Dzīvības: <span id="lives">10</span>
  </div>
  
  <canvas id="gameCanvas" width="600" height="400"></canvas>

  <div class="controls">
    <button id="buyPepe">Pirkt Pepe Torni ($50)</button>
    <button id="nextLevel">Sākt nākamo līmeni</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
